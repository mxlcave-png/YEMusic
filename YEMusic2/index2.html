
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>YEMusic</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" type="image/png" href="images/logo rond.png">
</head>
<body>

<div id="intro-screen">
<svg class="intro-logo-svg" viewBox="0 0 471 467" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad-disc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff2a1f"/>
            <stop offset="0.35" stop-color="#6a0020"/>
            <stop offset="0.75" stop-color="#e8561c"/>
            <stop offset="1" stop-color="#ffc83a"/>
        </linearGradient>
        <linearGradient id="grad-wave" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="400" y2="340">
            <stop offset="0" stop-color="#ff5a7a"/>
            <stop offset="0.5" stop-color="#ff4d94"/>
            <stop offset="1" stop-color="#ffa63d"/>
        </linearGradient>
        <filter id="blur-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="10"/>
        </filter>
    </defs>

    <!-- ondes sonores qui s'échappent du logo -->
    <circle class="pulse-ring" style="--d:2s" cx="236" cy="233" r="226" fill="none" stroke="#fff" stroke-width="3"/>
    <circle class="pulse-ring" style="--d:2.25s" cx="236" cy="233" r="226" fill="none" stroke="#fff" stroke-width="3"/>
    <circle class="pulse-ring" style="--d:2.5s" cx="236" cy="233" r="226" fill="none" stroke="#fff" stroke-width="3"/>

    <circle class="logo-disc" cx="236" cy="233" r="226" fill="url(#grad-disc)"/>
    <circle class="logo-ring" cx="236" cy="233" r="226" pathLength="1" fill="none" stroke="#ffd9b0" stroke-width="5"/>

    <!-- lueur néon : même tracé que l'onde, mais flouté -->
    <path class="logo-wave logo-wave-glow" pathLength="1" fill="none" stroke="#ff7ab0" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur-glow)"
          d="M12,241 C23,234 61,194 77,199 C93,204 94,287 107,271 C120,255 143,86 157,101 C171,116 175,371 192,361 C209,351 240,53 257,43 C274,33 283,283 297,301 C311,319 327,164 342,151 C357,138 370,213 387,226 C404,239 435,230 445,231"/>

    <path class="logo-wave" pathLength="1" fill="none" stroke="url(#grad-wave)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"
          d="M12,241 C23,234 61,194 77,199 C93,204 94,287 107,271 C120,255 143,86 157,101 C171,116 175,371 192,361 C209,351 240,53 257,43 C274,33 283,283 297,301 C311,319 327,164 342,151 C357,138 370,213 387,226 C404,239 435,230 445,231"/>
</svg>
    <h1 class="intro-logo">
        <span class="letter" style="--i:1">Y</span><span class="letter" style="--i:2">E</span><span class="letter gradient-text" style="--i:3">M</span><span class="letter gradient-text" style="--i:4">u</span><span class="letter gradient-text" style="--i:5">s</span><span class="letter gradient-text" style="--i:6">i</span><span class="letter gradient-text" style="--i:7">c</span>
    </h1>
</div>

<header>
    <a href="index2.html">
        <img src="images/logo rond.png" alt="Logo YEMusic" class="logo">
    </a>
<nav>
    <a href="artistes2.html">Artistes</a>
    <a href="favoris.html">&#9829; Favoris</a>
    <a href="playlists.html">Playlists</a>
    <a href="recherche.html">&#128269; Recherche</a>
</nav>
</header>

<main>
    <section class="reprendre" id="reprendre" hidden>
        <a class="carte-reprendre" id="reprendre-lien" href="#">
            <img id="reprendre-img" src="" alt="" hidden>
            <div>
                <p class="reprendre-label">Reprendre l'écoute</p>
                <p class="reprendre-titre" id="reprendre-titre"></p>
                <p class="reprendre-sous" id="reprendre-sous"></p>
            </div>
            <span class="reprendre-play">&#9654;</span>
        </a>
    </section>
    <h2 style="text-align: center; margin-top: 30px;">Vos artistes préférés</h2>

    <div class="artistes" style="justify-content: center; margin-top: 20px; gap: 30px; flex-wrap: wrap;">
        
        <a class="lien-artiste" href="artiste-chris-brown.html">
        <div class="artiste">
            <img src="images/chris brown.jpg" alt="Chris Brown">
            <h3>Chris Brown</h3>
            <p>R&B / Pop</p>
        </div>
        </a>

        <a class="lien-artiste" href="artiste-drake.html">
        <div class="artiste">
            <img src="images/drake.jpg" alt="Drake">
            <h3>Drake</h3>
            <p>Rap / Hip-Hop</p>
        </div>
        </a>

        <a class="lien-artiste" href="artiste-ninho.html">
        <div class="artiste">
            <img src="images/ninho.jpg" alt="Ninho">
            <h3>Ninho</h3>
            <p>Rap / Trap</p>
        </div>
        </a>
    </div>
</main>

<footer>
    <p>Projet SNT - Yves-edrcik MONLOUIS - YEMusic - 2026</p>
</footer>
<script>
if (!sessionStorage.getItem('introPlayed')) {
    window.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('intro-active');
        const intro = document.getElementById('intro-screen');
        setTimeout(() => {
            document.body.classList.remove('intro-active');
            if (intro) intro.remove();
        }, 4300);
    });
    sessionStorage.setItem('introPlayed', 'true');
}  else {
    const intro = document.getElementById('intro-screen');
    if (intro) intro.remove();
}

</script>
<script>
(function () {
    let d = null;
    try { d = JSON.parse(localStorage.getItem('yemusic_dernier')); } catch (e) {}
    if (!d || !d.id || !d.lien || !/^[\w.\-]+\.html(\?.*)?$/.test(d.lien)) return;

    document.getElementById('reprendre').hidden = false;
    document.getElementById('reprendre-lien').href = d.lien;
    document.getElementById('reprendre-titre').textContent = d.titre || '';
    document.getElementById('reprendre-sous').textContent = [d.artiste, d.album].filter(Boolean).join(' · ');

    if (d.pochette) {
        const img = document.getElementById('reprendre-img');
        img.src = d.pochette;
        img.hidden = false;
        img.addEventListener('error', () => { img.hidden = true; });
    }
})();
</script>
<script src="transition.js"></script>
<script src="compte.js"></script>
</body>
</html>
