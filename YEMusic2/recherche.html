<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche - YEMusic</title>
<link rel="stylesheet" href="style2.css">
    <link rel="icon" type="image/png" href="images/logo rond.png">
</head>
<body>

<header>
    <a href="index2.html">
        <img src="images/logo rond.png" class="logo" alt="Logo YEMusic">
    </a>
    <nav>
        <a href="artistes2.html">Artistes</a>
        <a href="favoris.html">&#9829; Favoris</a>
        <a href="playlists.html">Playlists</a>
        <a href="recherche.html">&#128269; Recherche</a>
    </nav>
</header>

<main class="page-artiste">

    <h1 class="titre-page">Recherche</h1>
    <input type="text" id="q" class="barre-recherche" placeholder="Un artiste, un album, un titre..." autocomplete="off">
    <p class="note-lecteur centre" id="message"></p>

    <section class="section-artiste" id="bloc-artistes" hidden>
        <h2>Artistes</h2>
        <div class="grille-playlists" id="res-artistes"></div>
    </section>

    <section class="section-artiste" id="bloc-albums" hidden>
        <h2>Albums</h2>
        <div class="grille-playlists" id="res-albums"></div>
    </section>

    <section class="section-artiste" id="bloc-titres" hidden>
        <h2>Titres</h2>
        <ol class="tracklist" id="res-titres"></ol>
        <p class="note-lecteur" id="note-titres" hidden></p>
    </section>

</main>

<footer>
    <p>Projet SNT - Yves-edrcik MONLOUIS - YEMusic - 2026</p>
</footer>

<script src="albums-data.js"></script>
<script src="favoris.js"></script>
<script src="playlists.js"></script>
<script src="recherche.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const MAX_TITRES = 50;

function imageOuVide(src) {
    function vide() {
        const d = document.createElement('div');
        d.className = 'pochette-vide';
        d.textContent = '\u266A';
        return d;
    }
    if (!src) return vide();
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.addEventListener('error', () => img.replaceWith(vide()));
    return img;
}

function carte(href, image, titre, sous) {
    const a = document.createElement('a');
    a.className = 'carte-playlist';
    a.href = href;
    const h = document.createElement('h3');
    h.textContent = titre;
    const p = document.createElement('p');
    p.textContent = sous;
    a.append(imageOuVide(image), h, p);
    return a;
}

function afficher() {
    const q = $('q').value.trim();
    const res = rechercher(q);

    ['artistes', 'albums', 'titres'].forEach((k) => {
        $('res-' + k).innerHTML = '';
        $('bloc-' + k).hidden = true;
    });
    $('note-titres').hidden = true;

    if (!q) {
        $('message').textContent = 'Tape un mot pour chercher dans tes artistes, tes albums et tes titres.';
        return;
    }
    if (!res.artistes.length && !res.albums.length && !res.titres.length) {
        $('message').textContent = 'Aucun résultat pour "' + q + '".';
        return;
    }
    $('message').textContent = '';

    if (res.artistes.length) {
        $('bloc-artistes').hidden = false;
        res.artistes.forEach((a) => {
            $('res-artistes').append(carte(a.page, a.image, a.nom, a.albums.length + ' album(s)'));
        });
    }

    if (res.albums.length) {
        $('bloc-albums').hidden = false;
        res.albums.forEach((al) => {
            const sous = [al.artiste, al.annee, al.nbTitres ? al.nbTitres + ' titres' : ''].filter(Boolean).join(' · ');
            $('res-albums').append(carte(lienAlbum(al.cle, al.titreCarte, al.artiste, al.page, al.pochette), al.pochette, al.nom, sous));
        });
    }

    if (res.titres.length) {
        $('bloc-titres').hidden = false;
        res.titres.slice(0, MAX_TITRES).forEach((t, i) => {
            const li = document.createElement('li');
            li.className = 'resultat-titre';

            const num = document.createElement('span');
            num.className = 'num';
            num.textContent = i + 1;

            const titre = document.createElement('span');
            titre.className = 'titre';
            titre.textContent = t.titre;

            const sous = document.createElement('span');
            sous.className = 'sous-titre';
            sous.textContent = t.artiste + ' · ' + t.album;

            li.append(num, titre, sous);

            if (t.duree) {
                const d = document.createElement('span');
                d.className = 'duree';
                d.textContent = t.duree;
                li.append(d);
            }
            if (t.id) {
                const piste = { id: t.id, titre: t.titre, artiste: t.artiste, album: t.album, pochette: t.pochette, duree: t.duree };
                li.append(creerCoeur(piste), creerBoutonAjout(piste));
            }

            // un clic sur la ligne ouvre l'album
            li.addEventListener('click', () => { allerVers(t.lien); });
            $('res-titres').append(li);
        });
        if (res.titres.length > MAX_TITRES) {
            $('note-titres').hidden = false;
            $('note-titres').textContent = res.titres.length + ' titres trouvés, les ' + MAX_TITRES + ' premiers sont affichés. Précise ta recherche pour affiner.';
        }
    }
}

$('q').addEventListener('input', afficher);

// recherche déjà remplie : recherche.html?q=drake
const depart = new URLSearchParams(location.search).get('q');
if (depart) $('q').value = depart;
$('q').focus();
afficher();
</script>
<script src="transition.js"></script>
<script src="compte.js"></script>
</body>
</html>
