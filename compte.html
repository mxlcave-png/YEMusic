<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon compte - YEMusic</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="refonte.css">
    <link rel="icon" type="image/png" href="images/logo rond.png">
</head>
<body>

<header>
    <img src="images/logo rond.png" alt="Logo YEMusic" class="logo">
    <nav>
        <a href="index2.html">Accueil</a>
        <a href="artistes2.html">Artistes</a>
        <a href="recherche.html">Recherche</a>
        <a href="favoris.html">Favoris</a>
        <a href="playlists.html">Playlists</a>
        <a href="compte.html">Compte</a>
        <a href="parametres.html">Paramètres</a>
    </nav>
</header>

<main>
    <section class="page-compte">
        <div id="vue-connecte" hidden>
            <h2>Bonjour <span id="nom-connecte"></span></h2>
            <p>Tes favoris, tes playlists et ta progression sont sauvegardés en ligne.</p>
            <div class="actions">
                <button type="button" id="btn-deconnexion">Se déconnecter</button>
            </div>
        </div>

        <div id="vue-invite">
            <h2>Mon compte</h2>
            <p>Choisis un pseudo et un code (6 caractères minimum). Pour un nouveau compte, clique sur « Créer le compte ».</p>
            <input id="champ-pseudo" type="text" placeholder="Pseudo" autocomplete="username">
            <input id="champ-code" type="password" placeholder="Code" autocomplete="current-password">
            <div class="actions">
                <button type="button" id="btn-connexion">Se connecter</button>
                <button type="button" id="btn-creer">Créer le compte</button>
            </div>
        </div>

        <p id="message-compte" role="alert"></p>
    </section>
</main>

<script src="compte.js"></script>
<script>
    const $ = (id) => document.getElementById(id);

    function afficherMessage(texte, ok) {
        $('message-compte').textContent = texte;
        $('message-compte').className = ok ? 'ok' : 'erreur';
    }

    function champs() {
        return { pseudo: $('champ-pseudo').value.trim(), code: $('champ-code').value };
    }

    function valides(p) {
        if (!p.pseudo) { afficherMessage('Entre un pseudo.', false); return false; }
        if (p.code.length < 6) { afficherMessage('Le code doit contenir au moins 6 caractères.', false); return false; }
        return true;
    }

    $('btn-connexion').addEventListener('click', async () => {
        const p = champs();
        if (!valides(p)) return;
        afficherMessage('Connexion en cours…', true);
        const r = await YECompte.connexion(p.pseudo, p.code);
        afficherMessage(r.erreur || 'Connecté !', !r.erreur);
    });

    $('btn-creer').addEventListener('click', async () => {
        const p = champs();
        if (!valides(p)) return;
        afficherMessage('Création du compte…', true);
        const r = await YECompte.creer(p.pseudo, p.code);
        afficherMessage(r.erreur || 'Compte créé, bienvenue !', !r.erreur);
    });

    $('btn-deconnexion').addEventListener('click', async () => {
        await YECompte.deconnexion();
        afficherMessage('Tu es déconnecté.', true);
    });

    document.addEventListener('compte:change', (e) => {
        const u = e.detail.user;
        $('vue-connecte').hidden = !u;
        $('vue-invite').hidden = !!u;
        if (u) $('nom-connecte').textContent = (u.user_metadata && u.user_metadata.pseudo) || '';
    });
</script>
<script src="menu.js"></script>
<script src="pochettes.js"></script>
</body>
</html>
