<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes favoris - YEMusic</title>
<link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="refonte.css">
    <link rel="icon" type="image/png" href="images/logo rond.png">
</head>
<body>

<header>
    <img src="images/logo rond.png" alt="Logo YEMusic" class="logo">
    <nav>
        <a href="index2.html">Accueil</a>
        <a href="artistes2.html">Artistes</a>
        <a href="recherche.html">Recherche</a>
        <a href="favoris.html">Favoris</a>
        <a href="playlists.html">Playlists</a>
        <a href="compte.html">Compte</a>
        <a href="parametres.html">Paramètres</a>
    </nav>
</header>

<main class="page-artiste">

    <div class="nav-retour">
        <a href="index2.html" class="retour-artistes">&larr; Accueil</a>
        <a href="artistes2.html" class="retour-artistes">Tous les artistes</a>
    </div>

    <h1 class="titre-page">&#9829; Mes favoris</h1>
    <p class="note-lecteur" id="compteur"></p>

    <section class="section-artiste" id="section-lecteur">
        <h2>Écouter</h2>

        <div class="lecteur-perso">
            <div class="lp-infos">
                <img id="lp-pochette" src="" alt="">
                <div>
                    <p id="lp-titre">Choisis un titre</p>
                    <p class="lp-artiste" id="lp-artiste">Artiste</p>
                </div>
            </div>
            <div class="lp-centre">
                <div class="lp-boutons">
                    <button id="lp-shuffle" aria-label="Lecture aléatoire" aria-pressed="false">&#8644;</button>
                    <button id="lp-prev" aria-label="Titre précédent">&#9198;</button>
                    <button id="lp-play" aria-label="Lecture / pause">&#9654;</button>
                    <button id="lp-next" aria-label="Titre suivant">&#9197;</button>
                </div>
                <div class="lp-progress">
                    <span id="lp-pos">0:00</span>
                    <input type="range" id="lp-barre" min="0" max="100" value="0">
                    <span id="lp-dur">0:00</span>
                </div>
            </div>
        </div>

        <div class="lecteur">
            <div id="embed-spotify"></div>
        </div>
    </section>

    <section class="section-artiste">
        <h2>Titres</h2>
        <p class="note-lecteur" id="message-vide" hidden>Tu n'as pas encore de favoris. Ouvre un album et clique sur le cœur à côté d'un titre.</p>
        <ol class="tracklist" id="tracklist"></ol>
        <button class="btn-vider" id="btn-vider" hidden>Vider mes favoris</button>
    </section>

</main>



<script src="favoris.js"></script>
<script src="playlists.js"></script>
<script src="lecteur.js"></script>
<script>
const $ = (id) => document.getElementById(id);

const liste = lireFavoris();
const ol = $('tracklist');

if (!liste.length) {
    $('message-vide').hidden = false;
    $('section-lecteur').hidden = true;
    $('compteur').textContent = '';
} else {
    $('compteur').textContent = liste.length + ' titre(s) en favori';
    $('btn-vider').hidden = false;

    liste.forEach((f, i) => {
        const li = document.createElement('li');
        li.dataset.id = f.id;
        li.dataset.artiste = f.artiste || '';
        li.dataset.pochette = f.pochette || '';

        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = i + 1;

        const t = document.createElement('span');
        t.className = 'titre';
        t.textContent = f.titre;

        const s = document.createElement('span');
        s.className = 'sous-titre';
        s.textContent = [f.artiste, f.album].filter(Boolean).join(' · ');

        li.append(num, t, s);

        if (f.duree) {
            const d = document.createElement('span');
            d.className = 'duree';
            d.textContent = f.duree;
            li.append(d);
        }

        // cœur : retirer un titre le grise, il disparaît au prochain chargement
        li.append(creerCoeur(f, (actif) => li.classList.toggle('retire', !actif)), creerBoutonAjout(f));
        ol.append(li);
    });

    $('lp-pochette').src = liste[0].pochette || '';
    $('lp-artiste').textContent = liste[0].artiste || '';

    $('btn-vider').addEventListener('click', () => {
        if (confirm('Vider tous tes favoris ?')) {
            viderFavoris();
            location.reload();
        }
    });

    initLecteur(ol, 'spotify:track:' + liste[0].id);
}
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script src="transition.js"></script>
<script src="compte.js"></script>
<script src="menu.js"></script>
<script src="pochettes.js"></script>
</body>
</html>
